name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un PR que recibe un push nuevo cancela su ejecución anterior: no gastamos
# minutos en validar un commit que ya está superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Remote cache de Turborepo. Si los secretos no existen, Turborepo usa solo la
  # caché local de actions/cache y el workflow sigue funcionando igual.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Verify · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Caché de Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Exactamente lo mismo que ejecuta el hook pre-push y lo que ejecuta el
      # build de Vercel antes de construir (ADR 0007). Una sola definición de
      # "está en verde": formato, lint con reglas de seguridad, typecheck,
      # tests, sistema vacío (F0.19) y auditoría de dependencias.
      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

  e2e:
    name: E2E contra staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar que hay URL de staging
        id: target
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E omitidos::Falta la variable de repositorio STAGING_URL. Configúrala en Settings → Variables → Actions para que los E2E de fase corran contra staging."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar pnpm
        if: steps.target.outputs.listo == 'true'
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        if: steps.target.outputs.listo == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        if: steps.target.outputs.listo == 'true'
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores de Playwright
        if: steps.target.outputs.listo == 'true'
        run: pnpm --filter @sales-os/web exec playwright install --with-deps chromium

      - name: E2E de las fases entregadas
        if: steps.target.outputs.listo == 'true'
        env:
          # Apunta a staging: los E2E de fase validan el entorno real, no un
          # servidor local (plan §5B.2).
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          E2E_LAB_PASSWORD: ${{ secrets.LAB_ACCESS_PASSWORD }}
        run: pnpm --filter @sales-os/web exec playwright test

      - name: Guardar el informe de Playwright
        if: always() && steps.target.outputs.listo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
